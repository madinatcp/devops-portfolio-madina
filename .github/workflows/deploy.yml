name: Deploy Portfolio

on:
  push:
    [cite_start]branches: [ "main", "development" ] # Qaysi branchga push bo'lganda ishga tushishi 

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          [cite_start]path: './src' # Sayt kodlari joylashgan papka 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4